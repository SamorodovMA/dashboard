<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд расписания доставки</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 2rem 2.5rem;
        }

        h1 {
            font-weight: 600;
            font-size: 1.8rem;
            color: #000;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: #99a0ad;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            border-left: 3px solid #f94f0d;
            padding-left: 1rem;
        }

        /* ---------- Панель фильтров ---------- */
        .filters {
            background: #f8faff;
            border-radius: 20px;
            border: 1px solid #e9edf4;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .filters-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem 2rem;
        }

        .filters-row:last-child {
            align-items: center;
            justify-content: space-between;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 0 1 auto;
            min-width: 130px;
        }

        .filter-group label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #99a0ad;
        }

        .filter-group select,
        .filter-group input {
            padding: 0.5rem 0.8rem;
            border: 1px solid #d9e0e9;
            border-radius: 12px;
            background: white;
            font-size: 0.9rem;
            color: #000;
            transition: 0.2s;
            width: 100%;
            min-width: 130px;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: #f94f0d;
            outline: none;
            box-shadow: 0 0 0 3px rgba(249, 79, 13, 0.15);
        }

        .filter-group select:disabled {
            background: #f0f2f5;
            color: #99a0ad;
            cursor: not-allowed;
        }

        .filter-group.checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 0.4rem;
            /* уменьшил отступ */
            min-width: auto;
        }

        .filter-group.checkbox-group label {
            text-transform: none;
            font-weight: 500;
            color: #000;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .filter-group.checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f94f0d;
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
            /* убираем лишние отступы */
        }

        .btn-calculate {
            background: #f94f0d;
            color: white;
            border: none;
            padding: 0.6rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-calculate:hover {
            background: #d93e0a;
            transform: scale(1.02);
        }

        @media (max-width: 900px) {
            .filters-row {
                gap: 1rem;
            }

            .filter-group {
                min-width: 100px;
            }
        }

        @media (max-width: 700px) {
            .container {
                padding: 1rem;
            }

            .filters-row {
                flex-direction: column;
                align-items: stretch;
            }

            .filters-row:last-child {
                align-items: stretch;
            }

            .filter-group {
                min-width: auto;
            }

            .btn-calculate {
                width: 100%;
                text-align: center;
            }
        }

        /* ---------- Результат ---------- */
        .result-area {
            margin-top: 0.5rem;
        }

        .result-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            background: #fafcff;
            border-radius: 24px;
            border: 1px dashed #d0d9e6;
            color: #99a0ad;
            font-size: 1.1rem;
        }

        .result-placeholder span {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .result-card {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- БЛОК ПДД (горизонтальный календарь) ---------- */
        .pdd-block {
            background: #fafcff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
        }

        .pdd-block .pdd-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #99a0ad;
            margin-bottom: 1rem;
        }

        .pdd-calendar {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem 2rem;
        }

        .pdd-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            padding: 0.5rem 0.2rem;
            border-radius: 16px;
            border: 2px solid transparent;
            transition: 0.2s;
            cursor: pointer;
        }

        .pdd-day.selected {
            border-color: #f94f0d;
            background: rgba(249, 79, 13, 0.05);
        }

        .pdd-day .day-week {
            font-size: 0.7rem;
            font-weight: 600;
            color: #99a0ad;
            text-transform: uppercase;
        }

        .pdd-day .day-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #000;
            line-height: 1.2;
        }

        .pdd-day .day-month {
            font-size: 0.6rem;
            color: #99a0ad;
            text-transform: uppercase;
        }

        .pdd-day .day-slot {
            margin-top: 0.4rem;
            padding: 0.25rem 0.8rem;
            border-radius: 30px;
            border: 1px solid #d9e0e9;
            background: white;
            font-size: 0.75rem;
            color: #000;
            cursor: pointer;
            transition: 0.2s;
            width: fit-content;
        }

        .pdd-day .day-slot.selected {
            border-color: #f94f0d;
            background: #f94f0d;
            color: white;
        }

        /* ---------- Детализация (таблица с донорами) ---------- */
        .stages-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 0.5rem;
            margin-top: 0.5rem;
        }

        .stages-table th {
            text-align: left;
            padding: 0.6rem 1rem;
            background: #f2f6fd;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #99a0ad;
            border-radius: 12px 12px 0 0;
        }

        .stages-table td {
            background: white;
            padding: 0.9rem 1rem;
            border-bottom: 1px solid #edf2f9;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .stages-table tr:last-child td {
            border-bottom: none;
        }

        .stage-name {
            font-weight: 600;
            color: #000;
        }

        .stage-dates {
            color: #000;
        }

        .stage-code {
            font-family: monospace;
            font-size: 0.9rem;
            background: #f0f4fe;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            color: #000;
        }

        .info-row {
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: #99a0ad;
            border-top: 1px solid #edf2f9;
            padding-top: 1rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        @media (max-width: 700px) {
            .pdd-calendar {
                gap: 0.5rem;
            }

            .pdd-day {
                min-width: 55px;
                padding: 0.3rem;
            }

            .pdd-day .day-number {
                font-size: 1rem;
            }

            .stages-table th,
            .stages-table td {
                padding: 0.6rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📦 Расписание доставки</h1>
        <div class="subtitle">Мониторинг синхронизации между AX ESHOP и сайтом</div>

        <!-- Панель фильтров -->
        <div class="filters" id="filterPanel">
            <div class="filters-row">
                <div class="filter-group">
                    <label for="product">Товар (артикул)</label>
                    <select id="product">
                        <option value="TEST-001">Тестовая позиция (все)</option>
                        <option value="SKU-1001">Сумка SKU-1001</option>
                        <option value="SKU-2002">Кроссовки SKU-2002</option>
                        <option value="SKU-3003">Платье SKU-3003</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="donor">Склад-донор</label>
                    <select id="donor">
                        <option value="Копт1">Копт1</option>
                        <option value="2001">2001</option>
                        <option value="098">098</option>
                        <option value="0512">0512</option>
                        <option value="ALL">Все доноры</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="destination">Склад комплектации</label>
                    <select id="destination">
                        <option value="КоптИнтмаг">КоптИнтмаг</option>
                        <option value="ИнтМаг">ИнтМаг</option>
                        <option value="ДИнтМаг">ДИнтМаг</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="deliveryType">Тип доставки</label>
                    <select id="deliveryType">
                        <option value="ССД">ССД</option>
                        <option value="ПВЗ">ПВЗ</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="deliveryCode">Код способа</label>
                    <select id="deliveryCode">
                        <!-- заполняется динамически -->
                    </select>
                </div>
            </div>

            <div class="filters-row">
                <div class="filter-group">
                    <label for="cardType">Тип карты клиента</label>
                    <select id="cardType">
                        <option value="White">Нет карты</option>
                        <option value="White">White</option>
                        <option value="Orange">Orange</option>
                        <option value="Black">Black</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="privilege">Привилегия</label>
                    <select id="privilege">
                        <option value="VIP_online">Нет привилегии</option>
                        <option value="VIP_online">VIP_online</option>
                        <option value="Orange+">Orange+</option>
                        <option value="Black">Black</option>
                        <option value="VIP_Outlet">VIP_Outlet</option>
                        <option value="CC_Private">CC Private</option>
                        <option value="Online_private">Online_private</option>
                        <option value="PVZ_Select">PVZ Select</option>
                    </select>
                </div>

                <div class="filter-group checkbox-group">
                    <input type="checkbox" id="testMode" checked>
                    <label for="testMode">Тестовая позиция (расчёт по всем донорам)</label>
                </div>

                <button class="btn-calculate" id="calcBtn">🚀 Рассчитать</button>
            </div>
        </div>

        <!-- Результат -->
        <div class="result-area">
            <div id="resultPlaceholder" class="result-placeholder">
                <span>📊</span>
                <p>Выберите параметры и нажмите «Рассчитать»</p>
            </div>

            <div id="resultCard" class="result-card">
                <!-- ПДД: горизонтальный календарь -->
                <div class="pdd-block" id="pddBlock">
                    <div class="pdd-label">📅 Плановая дата доставки</div>
                    <div class="pdd-calendar" id="pddCalendar">
                        <!-- заполняется скриптом -->
                    </div>
                </div>

                <!-- Детализация -->
                <h3 style="font-weight: 500; font-size: 1.1rem; margin-bottom: 0.5rem; color: #000;">Детализация расчёта
                </h3>
                <table class="stages-table" id="stagesTable">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Донор</th>
                            <th style="width: 20%;">Этап</th>
                            <th style="width: 25%;">Начало</th>
                            <th style="width: 25%;">Конец</th>
                            <th style="width: 15%;">Код расписания</th>
                        </tr>
                    </thead>
                    <tbody id="stagesBody"></tbody>
                </table>

                <div class="info-row">
                    <div><strong>Склад комплектации:</strong> <span id="selectedDestination">—</span></div>
                    <div><strong>Тип доставки:</strong> <span id="selectedDeliveryType">—</span></div>
                    <div><strong>Код способа:</strong> <span id="selectedDeliveryCode">—</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // ---------- Коды способов ----------
            const deliveryCodes = {
                'ССД': ['112b', '29b', '29d', '32b', '32d'],
                'ПВЗ': ['30', '27', '77', '70']
            };

            // ---------- Список доноров с их параметрами задержки ----------
            const donorConfig = {
                'Копт1': { baseDelayHours: 1, offsetDays: 0 },
                '2001': { baseDelayHours: 6, offsetDays: 1 },
                '098': { baseDelayHours: 10, offsetDays: 2 },
                '0512': { baseDelayHours: 24, offsetDays: 3 }
            };
            const donorList = Object.keys(donorConfig);

            // ---------- DOM ----------
            const productSelect = document.getElementById('product');
            const cardTypeSelect = document.getElementById('cardType');
            const privilegeSelect = document.getElementById('privilege');
            const donorSelect = document.getElementById('donor');
            const destSelect = document.getElementById('destination');
            const deliveryTypeSelect = document.getElementById('deliveryType');
            const deliveryCodeSelect = document.getElementById('deliveryCode');
            const testModeCheck = document.getElementById('testMode');
            const calcBtn = document.getElementById('calcBtn');

            const placeholder = document.getElementById('resultPlaceholder');
            const resultCard = document.getElementById('resultCard');
            const stagesBody = document.getElementById('stagesBody');
            const pddCalendar = document.getElementById('pddCalendar');
            const selectedDestination = document.getElementById('selectedDestination');
            const selectedDeliveryType = document.getElementById('selectedDeliveryType');
            const selectedDeliveryCode = document.getElementById('selectedDeliveryCode');

            // ---------- Управление доступностью селекта донора ----------
            function updateDonorSelectState() {
                const isTestMode = testModeCheck.checked;
                donorSelect.disabled = isTestMode;
            }
            testModeCheck.addEventListener('change', updateDonorSelectState);
            updateDonorSelectState();

            // ---------- Обновление кодов способа ----------
            function updateDeliveryCodes() {
                const type = deliveryTypeSelect.value;
                const codes = deliveryCodes[type] || [];
                deliveryCodeSelect.innerHTML = '';
                codes.forEach(code => {
                    const opt = document.createElement('option');
                    opt.value = code;
                    opt.textContent = code;
                    deliveryCodeSelect.appendChild(opt);
                });
            }
            deliveryTypeSelect.addEventListener('change', updateDeliveryCodes);
            updateDeliveryCodes();

            // ---------- Генерация этапов для одного донора ----------
            function generateStagesForDonor(donor, dest, deliveryType, deliveryCode, privilege, cardType, baseDateOffset) {
                const config = donorConfig[donor];
                if (!config) {
                    return generateStagesForDonor('Копт1', dest, deliveryType, deliveryCode, privilege, cardType, baseDateOffset);
                }
                const baseDelayHours = config.baseDelayHours;
                const offsetDays = config.offsetDays;

                const baseDate = new Date();
                baseDate.setDate(baseDate.getDate() + baseDateOffset + offsetDays);

                let delayFactor = 1.0;
                if (privilege === 'Orange+' || privilege === 'Black') delayFactor *= 0.8;
                if (privilege === 'VIP_online' || privilege === 'CC_Private') delayFactor *= 0.6;
                if (cardType === 'Black') delayFactor *= 0.9;
                if (cardType === 'Orange') delayFactor *= 0.95;

                let effectiveDelayHours = baseDelayHours * delayFactor;

                const codeNum = parseInt(deliveryCode) || 0;
                if (deliveryType === 'ССД') effectiveDelayHours += (codeNum % 10) * 0.2;
                else effectiveDelayHours += (codeNum % 10) * 0.3;

                // Расчёт этапов
                const startPick = new Date(baseDate);
                startPick.setHours(9, 0, 0, 0);
                const pickDuration = Math.max(0.5, effectiveDelayHours * 0.3);
                const endPick = new Date(startPick);
                endPick.setHours(startPick.getHours() + pickDuration);

                const startMove = new Date(endPick);
                startMove.setHours(endPick.getHours() + 0.1);
                const moveDuration = Math.max(1, effectiveDelayHours * 0.5);
                const endMove = new Date(startMove);
                endMove.setHours(startMove.getHours() + moveDuration);

                const startPack = new Date(endMove);
                startPack.setHours(endMove.getHours() + 0.1);
                const packDuration = 1.5 + (effectiveDelayHours * 0.1);
                const endPack = new Date(startPack);
                endPack.setHours(startPack.getHours() + packDuration);

                const startPDO = new Date(endPack);
                startPDO.setHours(endPack.getHours() + 0.1);
                const pdoDuration = 1;
                const endPDO = new Date(startPDO);
                endPDO.setHours(startPDO.getHours() + pdoDuration);

                const startDelivery = new Date(endPDO);
                startDelivery.setHours(endPDO.getHours() + 0.1);
                let deliveryDuration = (deliveryType === 'ССД') ? 1 : 2;
                deliveryDuration += effectiveDelayHours * 0.1;
                const endDelivery = new Date(startDelivery);
                endDelivery.setHours(startDelivery.getHours() + deliveryDuration);

                return {
                    donor: donor,
                    stages: [
                        { name: 'Подбор', start: startPick, end: endPick, code: 'LS04307829' },
                        { name: 'Перемещение', start: startMove, end: endMove, code: 'LS04307829' },
                        { name: 'Упаковка', start: startPack, end: endPack, code: 'PS01965423' },
                        { name: 'ПДО', start: startPDO, end: endPDO, code: 'DS00832254' }, // изменено
                        { name: 'Доставка', start: startDelivery, end: endDelivery, code: 'DS00832254' }
                    ],
                    deliveryDate: startDelivery
                };
            }

            // ---------- Рендеринг ПДД с автовыделением по переданной дате ----------
            function renderPDD(deliveryDate) {
                const dates = [];
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                for (let i = 0; i < 7; i++) {
                    const d = new Date(today);
                    d.setDate(today.getDate() + i);
                    dates.push(d);
                }

                const slots = [
                    '09:00–12:00',
                    '12:00–15:00',
                    '15:00–18:00',
                    '18:00–20:00',
                    '20:00–23:00'
                ];

                // Определяем ближайший день к deliveryDate
                let selectedDateIndex = 0;
                let minDiff = Infinity;
                dates.forEach((d, idx) => {
                    const diff = Math.abs(d - deliveryDate);
                    if (diff < minDiff) {
                        minDiff = diff;
                        selectedDateIndex = idx;
                    }
                });
                // Для слота выбираем индекс, соответствующий выбранному дню (для демонстрации)
                let selectedSlotIndex = selectedDateIndex % slots.length;

                let html = '';
                dates.forEach((d, dayIdx) => {
                    const dayWeek = d.toLocaleDateString('ru-RU', { weekday: 'short' }).replace('.', '');
                    const dayNumber = d.getDate();
                    const month = d.toLocaleDateString('ru-RU', { month: 'short' }).replace('.', '');
                    let dayLabel = dayWeek;
                    if (dayIdx === 0) dayLabel = 'Сегодня';
                    else if (dayIdx === 1) dayLabel = 'Завтра';

                    const isSelectedDay = (dayIdx === selectedDateIndex);
                    const slotText = slots[dayIdx % slots.length];
                    const isSelectedSlot = (dayIdx === selectedDateIndex && (dayIdx % slots.length) === selectedSlotIndex);

                    html += `
                    <div class="pdd-day ${isSelectedDay ? 'selected' : ''}" data-day-index="${dayIdx}">
                        <div class="day-week">${dayLabel}</div>
                        <div class="day-number">${dayNumber}</div>
                        <div class="day-month">${month}</div>
                        <div class="day-slot ${isSelectedSlot ? 'selected' : ''}" data-day-index="${dayIdx}" data-slot-index="${dayIdx % slots.length}">${slotText}</div>
                    </div>
                `;
                });

                pddCalendar.innerHTML = html;

                // Обработчики кликов (сбрасывают автовыделение и выделяют только то, на что кликнули)
                const dayElements = pddCalendar.querySelectorAll('.pdd-day');
                const slotElements = pddCalendar.querySelectorAll('.day-slot');

                function clearSelection() {
                    dayElements.forEach(el => el.classList.remove('selected'));
                    slotElements.forEach(el => el.classList.remove('selected'));
                }

                dayElements.forEach(dayEl => {
                    dayEl.addEventListener('click', function (e) {
                        if (e.target.classList.contains('day-slot')) return;
                        clearSelection();
                        this.classList.add('selected');
                    });
                });

                slotElements.forEach(slotEl => {
                    slotEl.addEventListener('click', function (e) {
                        e.stopPropagation();
                        clearSelection();
                        this.classList.add('selected');
                    });
                });
            }

            // ---------- Рендеринг детализации ----------
            function renderStages(allDonorData) {
                let html = '';
                allDonorData.forEach(donorData => {
                    const donor = donorData.donor;
                    donorData.stages.forEach((stage, idx) => {
                        const startStr = stage.start.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                        const endStr = stage.end.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                        const donorDisplay = (idx === 0) ? donor : '';
                        html += `<tr>
                        <td>${donorDisplay}</td>
                        <td class="stage-name">${stage.name}</td>
                        <td class="stage-dates">${startStr}</td>
                        <td class="stage-dates">${endStr}</td>
                        <td><span class="stage-code">${stage.code}</span></td>
                    </tr>`;
                    });
                    html += `<tr style="height: 0.5rem;"><td colspan="5" style="background: transparent; border: none;"></td></tr>`;
                });
                stagesBody.innerHTML = html;
            }

            // ---------- Основная функция расчёта ----------
            function calculate() {
                const product = productSelect.value;
                const cardType = cardTypeSelect.value;
                const privilege = privilegeSelect.value;
                const donorSelection = donorSelect.value;
                const dest = destSelect.value;
                const deliveryType = deliveryTypeSelect.value;
                const deliveryCode = deliveryCodeSelect.value;
                const testMode = testModeCheck.checked;

                let donorsToProcess = [];
                if (testMode) {
                    donorsToProcess = donorList;
                } else {
                    if (donorSelection === 'ALL') {
                        donorsToProcess = donorList;
                    } else {
                        donorsToProcess = [donorSelection];
                    }
                }

                const allData = [];
                donorsToProcess.forEach((donor) => {
                    const data = generateStagesForDonor(donor, dest, deliveryType, deliveryCode, privilege, cardType, 0);
                    allData.push(data);
                });

                let bestDonorData = allData[0];
                allData.forEach(d => {
                    if (d.deliveryDate < bestDonorData.deliveryDate) {
                        bestDonorData = d;
                    }
                });

                renderPDD(bestDonorData.deliveryDate);
                renderStages(allData);

                selectedDestination.textContent = dest;
                selectedDeliveryType.textContent = deliveryType;
                selectedDeliveryCode.textContent = deliveryCode;

                placeholder.style.display = 'none';
                resultCard.style.display = 'block';
            }

            // ---------- События ----------
            calcBtn.addEventListener('click', calculate);
            window.addEventListener('DOMContentLoaded', calculate);
            testModeCheck.addEventListener('change', calculate);
        })();
    </script>
</body>

</html>
